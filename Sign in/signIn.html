<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="dFlex">
        <h5>HOUSIFY</h5>
        <div class="dFlex">
            <a href="">About us</a>
            <a href="">Properties</a>
            <a href="">Services</a>

        </div>
        <button class="customButton">CONTACT US</button>
    </header>
    <main>

        <form id="signInForm">
            <img class="logo" src="../assets/img/logo housify.png" alt="logo">
            <h1 class="">SIGN IN</h1>
            <input id="fullName" type="text" placeholder="Your full name..">
            <p id="nameError"></p>
            <input id="emailSignIn" type="email" placeholder="Email">
            <p id="emailError"></p>
            <input id="passwordSignIn" type="password" placeholder="Password">
            <p id="passwordError"></p>
            <input id="ConfirmPasswordSignIn" type="password" placeholder="Confirm password">
            <p id="ConfirmPasswordError"></p>
            <p class="fSize12px">Already have an account yet? <span><a href="../Log in/logIn.html">Log in
                        here.</a></span></p>
            <button type="submit" class="customButton">SIGN IN</button>
            <div id="formSuccess" class="success" role="status" aria-live="polite"></div>
        </form>

    </main>
    <footer class="footer">
        <div class="footer-container">

            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    <a href="#"><img src="../assets/icons/icons8-whatsapp-48.png" alt="WhatsApp"></a>
                    <a href="#"><img src="../assets/icons/icons8-facebook-48.png" alt="Facebook"></a>
                    <a href="#"><img src="../assets/icons/icons8-tiktok-24.png" alt="Tiktok"></a>
                </div>
            </div>

            <div class="footer-section center">
                <h3>Rina & Suela</h3>
                <p>All rights reserved © 2025</p>
            </div>

            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>Email: <span>RINASUELA@GMAIL.COM</span></p>
            </div>

        </div>
    </footer>
    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$/;
        const nameRegex = /^[a-zA-Z0-9._-]{3,20}$/;

        const form = document.getElementById("signInForm");

        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("emailSignIn");
        const passwordInput = document.getElementById("passwordSignIn");
        const confirmPasswordInput = document.getElementById("ConfirmPasswordSignIn");

        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const confirmPasswordError = document.getElementById("ConfirmPasswordError");

        fullNameInput.addEventListener("input", () => nameError.textContent = "");
        emailInput.addEventListener("input", () => emailError.textContent = "");
        passwordInput.addEventListener("input", () => passwordError.textContent = "");
        confirmPasswordInput.addEventListener("input", () => confirmPasswordError.textContent = "");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            let valid = true;

            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (!nameRegex.test(name)) {
                nameError.textContent = "Your username must be at least 3 characters.";
                nameError.style.color = "red";
                nameError.style.fontSize = "10px";
                valid = false;
            } else {
                nameError.textContent = "";
            }

            if (!emailRegex.test(email)) {
                emailError.textContent = "Please enter a valid email address.";
                emailError.style.color = "red";
                emailError.style.fontSize = "10px";
                valid = false;
            } else {
                emailError.textContent = "";
            }
            if (!passwordRegex.test(password)) {
                passwordError.textContent =
                    "Password must be at least 8 characters and include uppercase, lowercase, number & special character.";
                passwordError.style.color = "red";
                passwordError.style.fontSize = "10px";
                valid = false;
            } else {
                passwordError.textContent = "";
            }

            if (password !== confirmPassword) {
                confirmPasswordError.textContent = "Passwords do not match.";
                confirmPasswordError.style.color = "red";
                confirmPasswordError.style.fontSize = "10px";
                valid = false;
            } else {
                confirmPasswordError.textContent = "";
            }

            if (valid) {
                window.location.href = "../Log in/logIn.html";
            }
        });
    </script>
